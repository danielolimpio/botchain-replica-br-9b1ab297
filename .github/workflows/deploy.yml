name: Deploy Lovable via FTP na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # O preset static do Nitro conflita com a entrada SSR do TanStack Start.
      # O exportador invoca o handler compilado diretamente, sem npx, portas ou
      # servidor temporário, e grava somente HTML/assets em dist/static.
      - name: Build e exportação estática para Hostinger
        run: bun run build:hostinger

      - name: Validar exportação estática
        run: |
          test -f dist/static/index.html
          test -f dist/static/.htaccess
          test -d dist/static/assets
          echo "Páginas HTML: $(find dist/static -name index.html | wc -l)"
          echo "Arquivos totais: $(find dist/static -type f | wc -l)"

      - name: Deploy FTP para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/static/
          server-dir: /
          dangerous-clean-slate: true
          dry-run: false
          log-level: verbose
