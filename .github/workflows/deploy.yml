name: Deploy Lovable via FTP na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # Não usamos o preset "static" do Nitro (quebra com
      # "process.cwd is not implemented" nesta stack). Em vez disso, buildamos
      # um servidor Node SSR normal e o convertemos em site 100% estático
      # rodando/rastreando ele só aqui no CI (scripts/prerender-static.mjs).
      # Nenhum Node vai para a Hostinger — só dist/static/ via FTP.
      - name: Build + prerender estático (sem servidor Node em produção)
        run: bun run build:hostinger

      - name: Sanity check do output estático
        run: |
          test -f dist/static/index.html || (echo "index.html ausente em dist/static" && exit 1)
          test -f dist/static/.htaccess || (echo ".htaccess ausente em dist/static" && exit 1)
          ls -la dist/static/

      - name: Deploy FTP para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/static/
          server-dir: /
          dangerous-clean-slate: true
          dry-run: false
          log-level: verbose
